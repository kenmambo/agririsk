# ---------------------------------------------------------------------------
# AgriRisk Kenya - declarative pipeline configuration
# ---------------------------------------------------------------------------
# This file separates *what* the pipeline processes (datasets, validation
# rules, feature windows, model hyper-parameters) from *how* it does it (code
# in src/agrik). Real-data integrations should add entries here rather than
# hard-coding them in Python.
# ---------------------------------------------------------------------------

panel:
  grain: county-monthly          # MVP supports county-level monthly data
  frequency: M
  start_year: 2019
  end_year: 2022
  key_columns: [county_code, year, month]
  date_column: date

# Each logical dataset maps to one CSV under data/raw and data/processed.
# `source: synthetic` marks data that is NOT yet a real feed. Real providers
# register themselves in src/agrik/ingestion/providers.py (chirps, modis).
# Run live data without editing this file via:
#     python -m agrik --force-raw --source climate=chirps
# (the committed default stays synthetic so tests/fresh clones never hit the network)
datasets:
  climate:
    source: synthetic          # real option: chirps (CHIRPS v2.0 monthly, no auth)
    file: climate_monthly.csv
    description: "Rainfall (CHIRPS) + temperature (ERA5 via Open-Meteo when enrichment enabled)."
  vegetation:
    source: synthetic          # real option: modis (MOD13A1 v6.1, needs Earthdata Login)
    file: vegetation_monthly.csv
    description: "NDVI / EVI (MODIS connector ready; enable with credentials)."
  agriculture:
    source: synthetic          # real option: wb_foodindex (World Bank food production index)
    file: agriculture_monthly.csv
    description: "Production index (real feed: national FAO food production index - no county-grain source exists free)."
  market:
    source: synthetic          # real option: fewsnet_prices (FEWS NET county retail prices)
    file: market_monthly.csv
    description: "Urban maize retail price (real feed: FEWS NET marketpricefacts, county x month)."
  socioeconomic:
    source: synthetic          # real option: hdx_knbs (Global MPI subnational + WorldPop rural)
    file: socioeconomic_monthly.csv
    description: "Rural population, poverty (real feed: HDX MPI headcount KDHS-2022 + WorldPop ADM2)."
  outcome:
    source: synthetic          # real option: fewsnet_ipc (FEWS NET IPC phases)
    file: outcome_monthly.csv
    description: "Food-security risk index target (real feed: IPC Current Situation phases, county zones)."

# Column-level validation rules. Range checks are advisory (flagged, not fatal)
# unless a column is also listed in required_columns.
validation:
  required_columns:
    - county_code
    - year
    - month
    - date
  value_ranges:
    precipitation_mm: { min: 0, max: 1000 }   # CHIRPS monthly totals can exceed 800 mm
    temp_mean_c: { min: 5, max: 40 }
    ndvi: { min: -1, max: 1 }
    evi: { min: -1, max: 1 }
    prod_index: { min: 0, max: 300 }
    maize_price_kes_kg: { min: 5, max: 300 }
    poverty_rate: { min: 0, max: 1 }
    coping_capacity_index: { min: 0, max: 1 }
    food_security_risk_index: { min: 0, max: 100 }
    ipc_crisis_households: { min: 0, max: 1 }
  year_range: { min: 2000, max: 2030 }
  month_range: { min: 1, max: 12 }

feature_engineering:
  # Standardised anomaly (SPI-like) window per county.
  zscore_window: 24
  rolling_windows: [3, 6]
  lag_periods: [1, 3]

model:
  target: food_security_risk_index
  test_size: 0.25
  random_state: 42
  baseline:
    type: ridge
    alpha: 1.0

# --- M1: real external feeds ---------------------------------------------------
# Provider connectors live in src/agrik/ingestion/ (chirps.py, modis.py) and are
# selected through datasets.*.source. Downloaded rasters/granules are cached
# under data/raw/external/ (git-ignored) so re-runs are offline and cheap.
external:
  # Counties are approximated by disks around their registry centroids until
  # real county polygons (KNBS / GADM) are integrated in roadmap M2.
  county_buffer_km: 50
  # If a real-feed fetch fails, fall back to the clearly-labelled synthetic
  # slice for that dataset (provenance columns always show which is which).
  allow_synthetic_fallback: true
  chirps:
    base_url: "https://data.chc.ucsb.edu/products/CHIRPS-2.0/africa_monthly/tifs/"
    nodata: -9999
  modis:
    cmr_short_name: "MOD13A1"
    version: "061"
    # Kenya mainland bounding box [west, south, east, north] for granule search.
    bbox: [33.9, -4.9, 41.9, 5.5]
    # Volume guard: MODIS granules are ~50 MB each; cap per run. 372 = every
    # granule covering the 2019-2024 window (4 tiles x 93 composites, ~19 GB
    # cached) so all counties get full monthly coverage - no even-sampling gap.
    max_granule_downloads: 372
  # --- M1/M2+: optional climate temperature enrichment ----------------------
  openmeteo:
    # ERA5 daily mean 2m temperature (Open-Meteo Archive API, no auth),
    # averaged to months per county and merged into the climate frame as
    # temp_mean_c. Opt-in per run: --set external.openmeteo.enabled=true
    # (default false so committed runs stay offline/deterministic).
    base_url: "https://archive-api.open-meteo.com/v1/archive"
    enabled: false
  # --- M2: socioeconomic / market / outcome / agriculture feeds ---------------
  fewsnet:
    # USDA FEWS NET Data Warehouse public REST API (no auth, CSV extracts).
    base_url: "https://fdw.fews.net/api"
    iso3: "KE"
    product: "maize"           # matched case-insensitively; white maize grain preferred
    price_type: "Retail"       # urban market retail prices, KES/kg
  hdx:
    # UNDP/OPHI global MPI subnational for Kenya (KDHS 2022), county rows.
    mpi_url: "https://data.humdata.org/dataset/f27114d0-4094-4117-8eb7-19b815358f1c/resource/700e28f8-99e1-4a68-a78f-d4d2d6b6c04e/download/ken_mpi.csv"
    # WorldPop ADM2 rural population (HeiGIT mirror of the HDX risk-assessment inputs).
    rural_population_url: "https://hot.storage.heigit.org/heigit-hdx-public/risk_assessment_inputs/ken/KEN_ADM2_rural_population.csv"
  worldbank:
    # FAO-based national food production index (2014-16=100), annual, Kenya.
    api_url: "https://api.worldbank.org/v2/country/KEN/indicator/AG.PRD.FOOD.XD"
    indicator: "AG.PRD.FOOD.XD"
