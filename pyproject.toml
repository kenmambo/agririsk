[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrik"
version = "0.1.0"
description = "AgriRisk Kenya - a data-driven early warning and decision-support platform for climate-resilient agriculture and food security."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgriRisk Kenya" }]
keywords = ["food-security", "agriculture", "climate", "kenya", "early-warning", "data-science"]

# Runtime dependencies. Development-only tools live in requirements-dev.txt.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pydantic>=2.4",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "streamlit>=1.30",
    "plotly>=6.0",
]

[project.optional-dependencies]
# Geospatial extras are optional for the MVP so the core pipeline installs cleanly
# on Windows without compiled GDAL wheels. Enable later with: pip install -e ".[geo]"
geo = ["geopandas>=0.14", "shapely>=2.0"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
# M1 remote-sensing feeds (CHIRPS/MODIS connectors): pip install -e ".[rs]"
rs = ["rasterio>=1.3", "shapely>=2.0", "pyproj>=3.6", "requests>=2.32"]

[project.scripts]
agrik-build-data = "agrik.pipeline:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
